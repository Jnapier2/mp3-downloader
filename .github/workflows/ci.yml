name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact runtime dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Validate runtime imports
        run: python -c "import certifi, yt_dlp"
      - name: Compile
        run: python -m compileall -q mp3_downloader.py tests
      - name: Test offline behavior
        run: python -m unittest discover -s tests -v
      - name: Verify canonical launcher from an unrelated working directory
        shell: powershell
        run: |
          $foreign = Join-Path $env:RUNNER_TEMP "mp3 downloader foreign cwd"
          New-Item -ItemType Directory -Path $foreign -Force | Out-Null
          $launcher = Join-Path $env:GITHUB_WORKSPACE "run_mp3_downloader.bat"
          Push-Location $foreign
          try {
            & $launcher --version
            if ($LASTEXITCODE -ne 0) { throw "Canonical launcher --version failed with exit code $LASTEXITCODE" }
            if (Test-Path (Join-Path $foreign "config.json")) { throw "Launcher wrote config.json beneath caller CWD" }
          }
          finally {
            Pop-Location
          }

