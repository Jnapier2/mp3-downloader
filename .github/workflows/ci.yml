name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact runtime dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Validate runtime imports
        run: python -c "import certifi, yt_dlp"
      - name: Compile
        run: python -m compileall -q mp3_downloader.py tests
      - name: Test offline behavior with bounded diagnostics
        id: offline_tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> offline-tests.txt
          $exitCode = $LASTEXITCODE
          Get-Content -LiteralPath offline-tests.txt
          exit $exitCode
      - name: Upload offline-test diagnostics
        if: ${{ failure() && steps.offline_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: offline-tests-python-${{ matrix.python-version }}
          path: offline-tests.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

